[project]
name = "scamshield"
version = "0.1.0"
description = "Stateful voice phishing response demo"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1,<2",
    "langchain-google-genai>=4,<5",
    "langgraph>=1,<2",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
